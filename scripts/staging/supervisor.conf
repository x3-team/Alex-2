; Staging: php-fpm и воркер очереди. Управляется scripts/staging/staging.sh — на сервере руками не править.
[group:alex-staging]
programs=alex-staging-fpm,alex-staging-queue

[program:alex-staging-fpm]
command=__PHP_FPM__ --nodaemonize --fpm-config __FPM_CONF__
user=root
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/var/log/alex-staging-fpm.out.log
redirect_stderr=true

[program:alex-staging-queue]
command=/usr/bin/php __STAGING_ROOT__/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=__STAGING_ROOT__
user=__POOL_USER__
umask=002
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=60
stdout_logfile=__STAGING_ROOT__/storage/logs/queue.log
redirect_stderr=true
