; Отдельный мастер php-fpm для staging (supervisor: alex-staging:alex-staging-fpm).
; Управляется scripts/staging/staging.sh — на сервере руками не править.
[global]
pid = /run/alex-staging-fpm.pid
error_log = /var/log/alex-staging-fpm.log
daemonize = no

[alex-staging]
user = __POOL_USER__
group = www-data
listen = __FPM_SOCK__
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
