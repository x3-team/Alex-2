<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ошибка 404 — ALEX²</title>
    <meta
      name="description"
      content="Страница не найдена. Вернитесь на главную сайта ALEX² или перейдите в блог, личный кабинет или корзину."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#46556a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/error-404.css" />
  </head>
  <body>
    <div class="space" aria-hidden="true">
      <canvas class="space__particles" id="particle-canvas"></canvas>
    </div>
    <div class="space__scrim" aria-hidden="true"></div>

    <main class="error-page">
      <div class="error-card">
        <header class="error-head">
          <h1 class="error-title">Ошибка 404</h1>
          <p class="error-subtitle">
            Вы попали на сайт ALEX2, но мы не смогли найти именно то, что вы искали
          </p>
        </header>

        <nav class="error-nav" aria-label="Основные разделы">
          <a class="nav-btn nav-btn--primary" href="/">
            <span class="nav-btn__label">Вернуться на главную</span>
            <img
              class="nav-btn__icon"
              src="/assets/icons/arrow-right-light.svg"
              alt=""
              width="24"
              height="24"
            />
          </a>
          <a class="nav-btn" href="/blog">
            <span class="nav-btn__label">Блог</span>
            <img
              class="nav-btn__icon"
              src="/assets/icons/arrow-right-dark.svg"
              alt=""
              width="24"
              height="24"
            />
          </a>
          <a class="nav-btn" href="/account">
            <span class="nav-btn__label">Личный кабинет</span>
            <img
              class="nav-btn__icon"
              src="/assets/icons/arrow-right-dark.svg"
              alt=""
              width="24"
              height="24"
            />
          </a>
          <a class="nav-btn" href="/cart">
            <span class="nav-btn__label">Корзина</span>
            <img
              class="nav-btn__icon"
              src="/assets/icons/arrow-right-dark.svg"
              alt=""
              width="24"
              height="24"
            />
          </a>
        </nav>
      </div>
    </main>

    <script type="module" src="/assets/js/error-404.js"></script>
  </body>
</html>
